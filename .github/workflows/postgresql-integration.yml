name: PostgreSQL Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pydbadmin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pydbadmin_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      PYDBADMIN_TEST_POSTGRES_HOST: 127.0.0.1
      PYDBADMIN_TEST_POSTGRES_PORT: "5432"
      PYDBADMIN_TEST_POSTGRES_DATABASE: pydbadmin_test
      PYDBADMIN_TEST_POSTGRES_USER: postgres
      PYDBADMIN_TEST_POSTGRES_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,binary]"
      - run: pytest -m "integration and postgresql"
